name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: influmedia-web
  REGION: us-central1
  SERVICE_NAME: influmedia-web
  REPOSITORY: influmedia-web
  TG_DIR: ./infra/live/influmedia-web

jobs:
  terragrunt:
    name: Terragrunt Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terragrunt Init
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tf_path: terraform
          tg_version: 1.0.6
          tg_dir: ${{ env.TG_DIR }}
          tg_command: init

      - name: Terragrunt Apply
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tf_path: terraform
          tg_version: 1.0.6
          tg_dir: ${{ env.TG_DIR }}
          tg_command: apply

  build:
    name: Build & Push Container
    needs: terragrunt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker Client
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container
        run: |-
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

  # Corre en paralelo con build. Si una migración falla, el deploy no se
  # ejecuta y el sitio sigue igual.
  migrate:
    name: Run Migrations
    needs: terragrunt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SQL_INSTANCE: code-crypto-shared:us-central1:sites-db
      PROXY_VERSION: v2.14.0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      # Túnel a sites-db autenticado con la cuenta del deployer; no depende
      # de que la IP pública esté abierta.
      - name: Start Cloud SQL Auth Proxy
        run: |-
          curl -sSfo cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/$PROXY_VERSION/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "$SQL_INSTANCE" --port 5432 --health-check --http-port 9090 > proxy.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9090/startup >/dev/null && exit 0
            sleep 1
          done
          cat proxy.log
          exit 1

      - name: Run Payload Migrations
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |-
          # El secreto apunta al socket de Cloud Run; aquí se conecta por el proxy local.
          SOCKET_URL=$(gcloud secrets versions access latest \
            --secret sites-db-influmedia-web-database-url --project code-crypto-shared)
          echo "::add-mask::$SOCKET_URL"
          export DATABASE_URL="${SOCKET_URL%%\?*}"
          DATABASE_URL="${DATABASE_URL/@localhost\//@127.0.0.1:5432/}"
          echo "::add-mask::$DATABASE_URL"
          npx payload migrate

  deploy:
    name: Deploy to Cloud Run
    needs: [terragrunt, build, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          # DATABASE_URL viene de Secret Manager en code-crypto-shared (sites-db).
          # overwrite: DATABASE_URL antes era texto plano y no puede convivir con el secreto.
          secrets: |-
            DATABASE_URL=projects/584903132770/secrets/sites-db-influmedia-web-database-url:latest
          secrets_update_strategy: overwrite
          env_vars_update_strategy: overwrite
          flags: --add-cloudsql-instances=code-crypto-shared:us-central1:sites-db
          env_vars: |-
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            GCS_BUCKET=${{ vars.GCS_BUCKET }}
            GCS_PROJECT_ID=${{ vars.GCS_PROJECT_ID }}
            GCS_PREFIX=${{ vars.GCS_PREFIX }}

      - name: Show Service URL
        run: |-
          echo "URL: ${{ steps.deploy.outputs.url }}"
