name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: influmedia-web
  REGION: us-central1
  SERVICE_NAME: influmedia-web
  REPOSITORY: influmedia-web
  TG_DIR: ./infra/live/influmedia-web

jobs:
  terragrunt:
    name: Terragrunt Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terragrunt Init
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tf_path: terraform
          tg_version: 1.0.6
          tg_dir: ${{ env.TG_DIR }}
          tg_command: init

      - name: Terragrunt Apply
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tf_path: terraform
          tg_version: 1.0.6
          tg_dir: ${{ env.TG_DIR }}
          tg_command: apply

  build:
    name: Build & Push Container
    needs: terragrunt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker Client
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container
        run: |-
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

  deploy:
    name: Deploy to Cloud Run
    needs: [terragrunt, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |-
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            GCS_BUCKET=influmedia-web-media
            GCS_PROJECT_ID=${{ env.PROJECT_ID }}
            GCS_PREFIX=production

      - name: Show Service URL
        run: |-
          echo "URL: ${{ steps.deploy.outputs.url }}"
