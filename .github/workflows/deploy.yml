name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: influmedia-web
  REGION: us-central1
  SERVICE_NAME: influmedia-web
  REPOSITORY: influmedia-web
  TG_DIR: ./infra/live/influmedia-web

jobs:
  terragrunt:
    name: Terragrunt Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terragrunt Init
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tf_path: terraform
          tg_version: 1.0.6
          tg_dir: ${{ env.TG_DIR }}
          tg_command: init

      - name: Terragrunt Apply
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tf_path: terraform
          tg_version: 1.0.6
          tg_dir: ${{ env.TG_DIR }}
          tg_command: apply

  build:
    name: Build & Push Container
    needs: terragrunt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker Client
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Containers
        run: |-
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          # Mismo build, dos etapas: el sitio (runner) y la imagen del Job de migraciones.
          docker build --target migrator -t "$IMAGE_TAG-migrator" .
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG-migrator"
          docker push "$IMAGE_TAG"

  migrate:
    name: Run Migrations
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      # Si una migración falla, el workflow se detiene antes del deploy y el sitio sigue igual.
      - name: Execute Migrations Job
        run: |-
          gcloud run jobs update ${{ env.SERVICE_NAME }}-migrate \
            --region ${{ env.REGION }} \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}-migrator"
          gcloud run jobs execute ${{ env.SERVICE_NAME }}-migrate \
            --region ${{ env.REGION }} \
            --wait

  deploy:
    name: Deploy to Cloud Run
    needs: [terragrunt, build, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          # DATABASE_URL viene de Secret Manager en code-crypto-shared (sites-db).
          # overwrite: DATABASE_URL antes era texto plano y no puede convivir con el secreto.
          secrets: |-
            DATABASE_URL=projects/584903132770/secrets/sites-db-influmedia-web-database-url:latest
          secrets_update_strategy: overwrite
          env_vars_update_strategy: overwrite
          flags: --add-cloudsql-instances=code-crypto-shared:us-central1:sites-db
          env_vars: |-
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            GCS_BUCKET=${{ vars.GCS_BUCKET }}
            GCS_PROJECT_ID=${{ vars.GCS_PROJECT_ID }}
            GCS_PREFIX=${{ vars.GCS_PREFIX }}

      - name: Show Service URL
        run: |-
          echo "URL: ${{ steps.deploy.outputs.url }}"
