name: PR Validation (Dry-run)

on:
  pull_request:
    branches:
      - main

env:
  TG_DIR: ./infra/live/influmedia-web

jobs:
  terragrunt-plan:
    name: Terragrunt Plan (Dry-run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terragrunt Init
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tf_path: terraform
          tg_version: 1.0.6
          tg_dir: ${{ env.TG_DIR }}
          tg_command: init

      - name: Terragrunt Plan
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tf_path: terraform
          tg_version: 1.0.6
          tg_dir: ${{ env.TG_DIR }}
          tg_command: plan

  build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Build Container
        run: |-
          docker build -t test-image .
